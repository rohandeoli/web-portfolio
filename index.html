  <!-- Fonts are self-hosted via @fontsource-variable (imported in src/main.tsx). -->
</head>

<body>
  <!-- Resolve theme before first paint to avoid a flash. Falls back to OS preference
       for first-time visitors. Keep colors in sync with background.default in src/theme.tsx. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('themeMode');
        var mode = (saved === 'light' || saved === 'dark')
          ? saved
          : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = mode;
        document.documentElement.style.backgroundColor = mode === 'light' ? '#FAFAFA' : '#0A0A0A';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
        document.documentElement.style.backgroundColor = '#0A0A0A';
      }
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
